name: sumanth-ci-pipeline

# Trigger on pushes or PRs to your branch
on:
  push:
    branches:
      - assignment1-sumanth-9040660
  pull_request:
    branches:
      - assignment1-sumanth-9040660

jobs:
  build-test-container:
    runs-on: ubuntu-latest

    steps:
      - name: 🔄 Checkout Code
        uses: actions/checkout@v3

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 📦 Install Dependencies
        run: pip install -r app/requirements.txt

      - name: 🧪 Run Unit Tests
        run: python -m unittest app/test_app.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker Image
        run: docker build -f app/Dockerfile -t flask-app ./app

      - name: Run Docker Container
        run: |
          docker run -d -p 5000:5000 --name flask-app flask-app

      - name: 🛑 Stop Container
        run: docker stop flask-app

